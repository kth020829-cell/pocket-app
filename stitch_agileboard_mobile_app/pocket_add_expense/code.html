<script>
  let currentVal = 15000;
  const amountEl = document.getElementById('amount-val');
  const saveLabelEl = document.getElementById('save-label');
  const resetBtn = document.getElementById('reset-btn');

  function updateDisplay() {
    const formatted = currentVal.toLocaleString('ko-KR');
    amountEl.textContent = formatted;
    saveLabelEl.textContent = currentVal > 0 ? `Save ₩${formatted}` : 'Save Expense';
  }

  function addAmount(delta) {
    currentVal += delta;
    if (currentVal > 99999999) currentVal = 99999999;
    updateDisplay();
  }

  function keyPress(key) {
    if (key === 'back') {
      let str = currentVal.toString();
      str = str.slice(0, -1);
      currentVal = str.length > 0 ? parseInt(str, 10) : 0;
    } else if (key === '00') {
      if (currentVal > 0 && currentVal < 1000000) {
        currentVal = parseInt(currentVal.toString() + '00', 10);
      }
    } else {
      let str = currentVal === 0 ? key : currentVal.toString() + key;
      if (str.length <= 8) {
        currentVal = parseInt(str, 10);
      }
    }
    updateDisplay();
  }

  resetBtn.addEventListener('click', () => {
    currentVal = 0;
    updateDisplay();
  });

  // Category selection handler
  document.querySelectorAll('.category-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.category-chip').forEach(c => {
        c.className = 'category-chip flex flex-col items-center gap-1 p-2 rounded-xl bg-surface-container-lowest hover:bg-surface-container-low text-on-surface-variant transition-all transform active:scale-90';
        const innerIcon = c.querySelector('div');
        innerIcon.className = 'w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-[18px]';
        c.querySelector('span').className = 'font-label-sm text-label-sm font-medium truncate max-w-full';
      });

      chip.className = 'category-chip flex flex-col items-center gap-1 p-2 rounded-xl bg-secondary-container/30 text-secondary transition-all transform active:scale-90';
      const activeIcon = chip.querySelector('div');
      activeIcon.className = 'w-10 h-10 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-[18px]';
      chip.querySelector('span').className = 'font-label-sm text-label-sm font-semibold truncate max-w-full';
    });
  });
</script></main></body></html>
